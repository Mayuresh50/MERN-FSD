<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Focus Flow </title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>


    <section id="form-section">

        <form id="session-form">
            <h1>Focus Flow </h1>
            <h2>Create Study Session</h2>

            <label>Session Name</label>
            <input type="text" id="name" placeholder="" />
            <small class="error"></small>


            <label>Study Duration (minutes)</label>
            <input type="number" id="study" />
            <small class="error"></small>


            <label>Break Duration (minutes)</label>
            <input type="number" id="break" />
            <small class="error"></small>

            <label>Number of Cycles</label>
            <input type="number" id="cycles" />
            <small class="error"></small>


            <button type="submit" id="start-btn" disabled>Start Session</button>
        </form>
    </section>

    <section id="dashboard" class="hidden">
        <h2 id="phase-title"></h2>
        <div id="timer">00:00</div>
        <div id="progress">
            <div id="progress-bar"></div>
        </div>


        <p id="cycle-info"></p>

        <p id="paused-text" class="hidden">Paused</p>

        <button id="pause-btn">Pause</button>
        <button id="resume-btn" class="hidden">Resume</button>

        <div id="quote-box" class="hidden">
            <p id="quote">Loading motivation...</p>
        </div>

        <p id="autosave">Progress saved </p>
    </section>

    <section id="history" hidden>

        <h2>Session History</h2>
        <ul id="history-list"></ul>
    </section>

    <script src="script.js"></script>
</body>

</html>
